name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check EXPO_TOKEN secret
        id: check_token
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning title=EXPO_TOKEN missing::EXPO_TOKEN secret is not set in GitHub Secrets. Skipping Android APK build."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Expo and EAS
        if: steps.check_token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: pnpm install

      - name: Build APK locally
        if: steps.check_token.outputs.has_token == 'true'
        env:
          EXPO_OWNER: mayur2ks-team
        run: cd artifacts/mobile && eas build --platform android --profile preview --local --non-interactive --owner mayur2ks-team

      - name: Upload APK as GitHub Artifact
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/mobile/*.apk
          retention-days: 7
