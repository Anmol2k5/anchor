name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run typecheck

  build-web:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: cd artifacts/mockup-sandbox && BASE_PATH=/cuan PORT=4173 pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: artifacts/mockup-sandbox/dist/
          retention-days: 7

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: artifacts/mockup-sandbox/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/mockup-sandbox/dist/
      - uses: actions/deploy-pages@v4

  build-android:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      
      - name: Setup Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check EXPO_TOKEN secret
        id: check_token
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning title=EXPO_TOKEN missing::EXPO_TOKEN secret is not set in GitHub Secrets. Skipping Android APK build."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Expo and EAS
        if: steps.check_token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: pnpm install

      - name: Expo prebuild (generate native Android project)
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Make Gradle executable
        run: chmod +x artifacts/mobile/android/gradlew

      - name: Build debug APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
